<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JBoss · webapp Jarvis</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: #181818; color: #f0f0f0;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; background: #1f1f1f; border: 1px solid #3a3a3a;
    border-radius: 12px; padding: 28px 20px; text-align: center; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; letter-spacing: .04em; font-family: monospace; }
  p { margin: 0 0 8px; }
  .tenue { color: #a0a0a0; font-size: .9rem; }
  button { display: block; width: 100%; margin-top: 16px; font: inherit; font-weight: 600; padding: 13px;
    border-radius: 8px; cursor: pointer; }
  .primo { border: 0; background: #599ce7; color: #0d1520; }
  .secondo { border: 1px solid #599ce7; background: transparent; color: #599ce7; }
  button:focus { outline: 2px solid #f0f0f0; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>JBOSS</h1>
  <p>La webapp di Jarvis non risponde. «Hey Boss», «Hey JBoss» e il controllo del telefono funzionano lo stesso.</p>
  <p class="tenue">Controlla la rete, poi tocca «Riprova».</p>
  <button type="button" class="primo" id="riprova">Riprova</button>
  <button type="button" class="secondo" id="voce">Torna a JBoss</button>
</main>
<script>
  (function () {
    function chiama(nome) {
      try { if (window.JarvisApp && window.JarvisApp[nome]) window.JarvisApp[nome](); } catch (e) { /* niente */ }
    }
    document.getElementById("riprova").addEventListener("click", function () { chiama("riprova"); });
    document.getElementById("voce").addEventListener("click", function () { chiama("apriVoceETelefono"); });
  })();
</script>
</body>
</html>
